              <div className="flex items-center justify-between"><span className="mono text-sm text-white">{t('checkout.amz')}</span><span className="ds-badge">{t('checkout.amzFee')}</span></div>
              <p className="mono mt-1 text-[10px] text-zinc-500">{t('checkout.amzSub')}</p></button>
          </div></Card>
        {sub==='cq'&&<Card><h3 className="font-bold text-white">{t('checkout.cq.0')}</h3><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.cq.1')}</p><div className="mt-3 flex gap-2"><Btn cls="flex-1" onClick={()=>setSub('conf')}>{t('checkout.cq.2')}</Btn><Btn v="outline" cls="flex-1" onClick={()=>setSub('cg')}>{t('checkout.cq.3')}</Btn></div></Card>}
        {sub==='cg'&&<Card><h3 className="font-bold text-white">{t('checkout.cg.0')}</h3><ol className="mt-3 space-y-2">{t('checkout.cg').slice(1,5).map((x,i)=><li key={i} className="flex gap-2 text-sm text-zinc-300"><span className="mono text-cyan-400">{i+1}.</span>{x}</li>)}</ol><Btn cls="mt-4 w-full" onClick={()=>setSub('conf')}>{t('checkout.cg.5')}</Btn></Card>}
        {sub==='aq'&&<Card><h3 className="font-bold text-white">{t('checkout.aq.0')}</h3><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.aq.1')}</p><div className="mt-3 flex gap-2"><Btn cls="flex-1" onClick={()=>setSub('conf')}>{t('checkout.aq.2')}</Btn><Btn v="outline" cls="flex-1" onClick={()=>setSub('ag')}>{t('checkout.aq.3')}</Btn></div></Card>}
        {sub==='ag'&&<Card><h3 className="font-bold text-white">{t('checkout.ag.0')}</h3><p className="mt-2 text-sm text-zinc-400">{t('checkout.ag.1')}</p><p className="mono mt-2 text-[10px] text-amber-400">{t('checkout.ag.2')}</p><Btn cls="mt-4 w-full" onClick={()=>setSub('conf')}>{t('checkout.ag.3')}</Btn></Card>}
        {sub==='bon'&&<Card><h3 className="font-bold text-white">{t('checkout.bon')}</h3><p className="mt-2 text-sm text-zinc-400">{t('checkout.bonFee')} · SEPA</p><Btn cls="mt-4 w-full" onClick={()=>setSub('conf')}>{t('common.proceed')}</Btn></Card>}
        {sub==='conf'&&<Card>
          <h3 className="text-lg font-bold text-white">{t('checkout.conf')}</h3><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.rate')}</p>
          {order.method==='crypto'&&<div className="mt-3"><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.net')}</p>
            <div className="mt-2 flex gap-2">{['USDT','BTC','LTC'].map(n=><button key={n} onClick={()=>setOrder(o=>({...o,coin:n}))} className={clsx('flex-1 rounded-lg border p-3 mono text-xs',order.coin===n?'border-cyan-400/70 bg-cyan-400/10 text-cyan-400':'border-line text-zinc-300')}>{n}</button>)}</div>
            {order.coin&&<div className="mt-3 rounded-lg border border-line bg-black/40 p-3"><p className="mono text-[9px] tracking-widest text-zinc-500">{t('checkout.send')}</p><p className="mono break-all text-xs text-cyan-400">{WALLETS[order.coin]}</p><button onClick={async()=>{await cp(WALLETS[order.coin]);toastMsg(t('common.copied'))}} className="mono mt-2 text-[10px] uppercase tracking-widest text-zinc-400 hover:text-cyan-400">{t('common.copy')}</button></div>}</div>}
          {order.method==='amazon'&&<div className="mt-3"><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.acode')}</p><input className="ds-input mt-2" placeholder="XXXX-XXXX-XXXX-XXX" onChange={e=>setOrder(o=>({...o,voucher:e.target.value.toUpperCase()}))}/></div>}
          <div className="mt-4 space-y-1 border-t border-line pt-3">
            <div className="flex justify-between text-sm"><span className="text-zinc-400">{t('checkout.sub')}</span><span className="mono text-zinc-200">{money(total,lang)}</span></div>
            {order.method==='bonifico'&&<div className="flex justify-between text-sm"><span className="text-zinc-400">{t('checkout.bfee')}</span><span className="mono text-zinc-200">+{money(total*.1,lang)}</span></div>}
            {order.method==='amazon'&&<div className="flex justify-between text-sm"><span className="text-zinc-400">{t('checkout.vfee')}</span><span className="mono text-zinc-200">+{money(total*.2,lang)}</span></div>}
            <div className="flex justify-between pt-2"><span className="mono text-xs uppercase tracking-widest text-zinc-400">{t('checkout.pay')}</span><span className="mono text-lg font-bold text-emerald-400">{money(finalTotal,lang)}</span></div>
          </div>
          <Btn cls="mt-4 w-full" onClick={confirm}>{t('checkout.confirm')} {(order.method||'').toUpperCase()}</Btn>
        </Card>}
      </div>}

      {step===3&&<Card cls="text-center"><Corner/>
        <div className="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-400/15 text-2xl text-emerald-400">✓</div>
        <h1 className="text-xl font-bold text-white">{t('checkout.done')}</h1><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.doneSub')}</p>
        <div className="mt-4 rounded-xl border border-emerald-400/30 bg-emerald-400/5 p-4"><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.code')}</p><p className="mono mt-1 text-2xl font-bold tracking-widest text-emerald-400">{code}</p>
          <button onClick={async()=>{await cp(code);toastMsg(t('common.copied'))}} className="mono mt-2 text-[10px] uppercase tracking-widest text-zinc-400 hover:text-emerald-400">{t('checkout.copyCode')}</button></div>
        <p className="mono mt-4 text-[10px] tracking-widest text-zinc-500">{t('checkout.wait')}</p>
        <div className="mt-4 flex flex-wrap justify-center gap-2"><a href={TG} target="_blank" rel="noreferrer"><Btn>{t('checkout.contact')}</Btn></a><Btn v="outline" onClick={()=>{clear();nav('/menu')}}>{t('checkout.back')}</Btn></div>
        <p className="mt-4 text-xs text-zinc-400">{t('checkout.warn')}</p>
      </Card>}
    </div>
  );
}

/* ================= APP ================= */
function Router(){
  const p=useRoute();const seg=p.split('/').filter(Boolean);const r=seg[0];
  if(!r)return <Boot/>;
  if(r==='lang')return <LangModal/>;
  let page;
  if(r==='menu')page=<Menu/>;
  else if(r==='contact')page=<Contact/>;
  else if(r==='cash')page=<Cash/>;
  else if(r==='paypal')page=<Paypal/>;
  else if(r==='quality')page=<Quality/>;
  else if(r==='feedback')page=<Feedback/>;
  else if(r==='faq')page=<Faq/>;
  else if(r==='privacy'||r==='terms'||r==='cookies')page=<Legal doc={r}/>;
  else if(r==='checkout')page=<Checkout/>;
  else page=<Menu/>;
  return (<><Header/>{page}<Footer/><CartDrawer/></>);
}
function Toast(){const {toast}=useApp();if(!toast)return null;return <div className="pop fixed bottom-6 left-1/2 z-[100] -translate-x-1/2 rounded-full border border-emerald-400/40 bg-surface/95 px-5 py-2.5 mono text-[11px] uppercase tracking-widest text-emerald-400 backdrop-blur-xl">{toast}</div>;}
function Fab(){return <a href={TG} target="_blank" rel="noreferrer" aria-label="Telegram" className="fixed bottom-6 right-5 z-[80] flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-sky-400 to-blue-500 text-white shadow-[0_8px_30px_-8px_rgba(77,124,255,.9)] transition-transform hover:scale-105"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.6 20c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.1 1.4 11.6c-1-.3-1-1 .2-1.5l19-7.3c.9-.3 1.6.2 1.3 1.5z"/></svg></a>;}
function App(){return (<Provider><Router/><Toast/><Fab/></Provider>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
